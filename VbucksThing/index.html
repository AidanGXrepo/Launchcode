<!DOCTYPE html>
<html>
<head>
    <title>Vbucks Generator</title>

    <style>
        body {
            background-color: blue;
        }

        h1{
           display:block;
            width:400px;
            margin:24px auto;
            padding:14px;
            background:navy;
            color:black;
            text-decoration:none;
            border-radius:6px;
            font-weight:bold;
            font-size:60px;
            transition:0.2s;
            box-shadow:0 0 15px rgba(0,0,0,0.5);

        }

             display:block;

            border-radius:12px;

            font-size:20px;

            box-shadow:0 0 15px rgba(0,0,0,0.5);
            text-align:center;

        }

        button {
            display:block;
            width:260px;
            margin:12px auto;
            padding:14px;
            background:gold;
            color:black;
            text-decoration:none;
            border-radius:12px;
            font-weight:bold;
            font-size:20px;
            transition:0.2s;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
            text-align:center;
        }

        button:hover{
            transform:scale(1.06);
        }

        .gold-group {
            margin-top: 80px;
        }

        .gold-group button {

        button.normal {

            padding:14px;
            background:lightblue;
            color:black;
            text-decoration:none;
            border-radius:12px;

            font-size:20px;
            transition:0.2s;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
            text-align:center;
        }
    </style>
</head>

<body>

    <h1>Vbucks Generator</h1>

    <input type="text" placeholder="Your Username">

    <button class=normal onclick="alert('Username Saved to Generator')">

    </button>

    <div class="gold-group">
        <button class="gold-button" onclick="window.location.href='Data/1000.html'">1000 Vbucks</button>
        <button class="gold-button" onclick="window.location.href='Data/2800.html'">2800 Vbucks</button>
        <button class="gold-button" onclick="window.location.href='Data/5000.html'">5000 Vbucks</button>
        <button class="gold-button" onclick="window.location.href='Data/10000.html'">10000 Vbucks</button>

</html>
