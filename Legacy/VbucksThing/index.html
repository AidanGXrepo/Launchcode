<!DOCTYPE html>
<html>
<head>
    <title>Vbucks Generator</title>

    <style>
        body {
           color: rgb(38, 123, 217);
           font-family: Arial, sans-serif;
           background: rgb(38, 123, 217);
           margin: 0;
           padding: 0;
           position: relative;
           min-height: 100vh;
        }

        .logo {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 120px;
            height: auto;
            z-index: 10;
        }

        h1{
           display:block;
            width:800px;
            margin:24px auto;
            padding:14px;
            background:transparent;
            color:black;
            text-decoration:none;
            border-radius:6px;
            font-weight:bold;
            font-size:60px;
            transition:0.2s;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
            text-align:center;
        }
        

        input {
             display:block;
            width:260px;
            margin:12px auto;
            padding:14px;
            background:lightblue;
            color:black;
            text-decoration:none;
            border-radius:12px;
            font-weight:bold;
            font-size:20px;
            transition:0.2s;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
            text-align:center;

        }

        button {
            display:block;
            width:260px;
            margin:12px auto;
            padding:14px;
            background:gold;
            color:black;
            text-decoration:none;
            border-radius:12px;
            font-weight:bold;
            font-size:20px;
            transition:0.2s;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
            text-align:center;
        }

        button:hover{
            transform:scale(1.06);
        }

        .gold-group {
            margin-top: 80px;
        }

        .gold-group button {
            margin: 4px auto;
        }

        button.normal {
            display:block;
            width:260px;
            margin:12px auto;
            padding:14px;
            background:lightblue;
            color:black;
            text-decoration:none;
            border-radius:12px;
            font-weight:bold;
            font-size:20px;
            transition:0.2s;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
            text-align:center;
        }
    </style>
</head>

<body>
    <img src="Group.png" alt="Vbucks Generator Logo" style="display:block; width: 320px; margin: 24px auto;">

    <input type="text" placeholder="Your Username">

    <button class=normal onclick="alert('Username Saved to Generator')">
        Save to generator
    </button>

    <div class="gold-group">
        <button class="gold-button" onclick="window.location.href='Data/1000.html'">1000 Vbucks</button>
        <button class="gold-button" onclick="window.location.href='Data/2800.html'">2800 Vbucks</button>
        <button class="gold-button" onclick="window.location.href='Data/5000.html'">5000 Vbucks</button>
        <button class="gold-button" onclick="window.location.href='Data/10000.html'">10000 Vbucks</button>
    </div>

</body>
</html>
