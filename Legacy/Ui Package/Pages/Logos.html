<!DOCTYPE html>
<html>
    <head>
        <title>Logos</title>
        <style>
            h1 {
                display: block;
                width: 400px;
                margin: 24px auto;
                padding: 14px;
                background: gray;
                color: black;
                text-decoration: none;
                border-radius: 6px;
                font-weight: bold;
                font-size: 60px;
                transition: 0.2s;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
                text-align: center;
            }

            h2 {
                display: block;
                width: 350px;
                margin: 12px auto;
                padding: 14px;
                background: gray;
                color: black;
                text-decoration: none;
                border-radius: 12px;
                font-weight: bold;
                font-size: 20px;
                transition: 0.2s;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
                text-align: center;
            }

            h3 {
                display: block;
                width: 800px;
                margin: 24px auto;
                padding: 14px;
                background: gray;
                color: black;
                text-decoration: none;
                border-radius: 6px;
                font-weight: bold;
                font-size: 15px;
                transition: 0.2s;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
                text-align: center;
            }
               button {
                display: block;
                width: 290px;
                margin: 12px auto;
                padding: 14px;
                background: gray;
                color: black;
                text-decoration: none;
                border-radius: 12px;
                font-weight: bold;
                font-size: 20px;
                transition: 0.2s;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
                text-align: center;
            }


            button.hover:hover {
                transform: scale(1.06);
            }
        </style>
    </head>
    <body>
        <h1>Importing logos</h1>
        <h2>To import a logo take the code from this button:</h2>
        <button onclick="window.location.href='https://github.com/AidanGXrepo/Launchcode/raw/refs/heads/main/Ui%20Package/Code/Logos'">Logos</button>
        <h3>replace "filename.extension" with the actual name of your logo file, make sure it's in the same directory. you can change the width, margin, and padding to your desire</h3>
        
    </body>
</html>
