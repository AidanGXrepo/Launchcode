<!DOCTYPE html>
<html>
    <head>
        <title>Clicker</title>
        <style>
            body {
                background-color: rgb(38, 123, 217);
            }
            h1 {
                display: block;
                width: 400px;
                margin: 24px auto;
                padding: 14px;
                background: gray;
                color: black;
                text-decoration: none;
                border-radius: 6px;
                font-weight: bold;
                font-size: 60px;
                transition: 0.2s;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
                text-align: center;
            }

            h2 {
                display: block;
                width: 200px;
                margin: 12px auto;
                padding: 14px;
                background: Gold;
                color: black;
                text-decoration: none;
                border-radius: 12px;
                font-weight: bold;
                font-size: 20px;
                font-family: 'Ubuntu', sans-serif;
                transition: 0.2s;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
                text-align: center;
            }

            h3 {
                text-align: center;
                font-size: 30px;
                color: black;
            }

               button {
                display: block;
                width: 290px;
                margin: 12px auto;
                padding: 14px;
                background: gray;
                color: black;
                text-decoration: none;
                border-radius: 12px;
                font-weight: bold;
                font-size: 20px;
                transition: 0.2s;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
                text-align: center;
            }

               button.clicker {
                display: block;
                width: 140px;
                height: 140px;
                margin: 12px auto;
                padding: 0;
                background: transparent;
                border: none;
                color: black;
                text-decoration: none;
                border-radius: 12px;
                font-weight: bold;
                font-size: 20px;
                transition: transform 0.08s ease, filter 0.08s ease;
                box-shadow: none;
                text-align: center;
                cursor: pointer;
            }

            button.clicker:hover {
                transform: scale(1.05);
            }

            button.clicker:active,
            button.clicker.pressed {
                transform: scale(0.95);
                filter: brightness(1.08);
            }


            button:hover {
                transform: scale(1.06);
            }

            #shopPanel {
                display: none;
                width: 320px;
                margin: 16px auto;
                padding: 16px;
                background: rgba(0, 0, 0, 0.15);
                border-radius: 12px;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            }

            #shopPanel button {
                width: 260px;
            }

        </style>
    </head>
    <body>
        <img src="clicker.png" alt="Clicker Logo" style="display:block; width: 640px; margin: 48px auto;">
        <h3>Click the button or the spacebar to make coins!</h3>
        <button class="clicker" id="clickButton" onclick="increaseScore()" aria-label="Click for 1 coin">
            <img src="Button.png" alt="Click button" style="width: 100%; height: 100%; object-fit: contain;">
        </button>
        <h2>Coins: <span id="score">0</span></h2>
        <h3>Coins/Click: <span id="clickValue">1</span></h3>
        <h3>Coins/sec: <span id="cps">0</span></h3>
        <button onclick="toggleShop()">Shop</button>

        <div id="shopPanel">
            <button onclick="buyDoubleClick()">Double Click Amount</button>
            <p id="doubleClickInfo" style="text-align:center; color:black; font-weight:bold;">Cost: 50 coins</p>
            <button onclick="buyIdleCoins()">Idle Coins +5/sec</button>
            <p id="idleInfo" style="text-align:center; color:black; font-weight:bold;">Cost: 500 coins</p>
            <div id="spamUnlockRow" style="display:block;">
                <button onclick="buyKeySpam()">Holding key spams button</button>
                <p style="text-align:center; color:black; font-weight:bold;">Cost: 1000000000 coins</p>
            </div>
        </div>
        <script>
            let score = 0;
            let clickValue = 1;
            let doubleClickCost = 50;
            let doubleClickOwned = 0;
            let idleCoinsPerSecond = 0;
            let idleCost = 500;
            let idleOwned = 0;
            let allowKeySpam = false;
            const KEY_SPAM_COST = 1000000000;

            const SAVE_KEY = 'clickerSave';

            function saveGame() {
                localStorage.setItem(SAVE_KEY, JSON.stringify({
                    score,
                    clickValue,
                    doubleClickCost,
                    doubleClickOwned,
                    idleCoinsPerSecond,
                    idleCost,
                    idleOwned,
                    allowKeySpam
                }));
            }

            function loadGame() {
                const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');

                if (!saved) return;

                score = saved.score || 0;
                clickValue = saved.clickValue || 1;
                doubleClickCost = saved.doubleClickCost || 50;
                doubleClickOwned = saved.doubleClickOwned || 0;
                idleCoinsPerSecond = saved.idleCoinsPerSecond || 0;
                idleCost = saved.idleCost || 500;
                idleOwned = saved.idleOwned || 0;
                allowKeySpam = Boolean(saved.allowKeySpam);
            }

            function updateShopInfo() {
                document.getElementById('doubleClickInfo').textContent =
                    'Owned: ' + doubleClickOwned + ' | Next cost: ' + doubleClickCost + ' coins';
                document.getElementById('idleInfo').textContent =
                    'Owned: ' + idleOwned + ' | Next cost: ' + idleCost + ' coins';
            }

            function updateClickValueDisplay() {
                document.getElementById('clickValue').textContent = clickValue;
                const button = document.getElementById('clickButton');
                if (button) {
                    button.setAttribute('aria-label', 'Click for ' + clickValue + ' coin' + (clickValue === 1 ? '' : 's'));
                    button.title = 'Click for ' + clickValue + ' coin' + (clickValue === 1 ? '' : 's');
                }
            }

            function increaseScore() {
                score += clickValue;
                document.getElementById('score').textContent = score;
                updateClickValueDisplay();
                saveGame();
            }

            function updateCpsDisplay() {
                document.getElementById('cps').textContent = idleCoinsPerSecond;
            }

            function updateSpamUnlockUI() {
                const row = document.getElementById('spamUnlockRow');
                if (row) {
                    row.style.display = allowKeySpam ? 'none' : 'block';
                }
            }

            function buyDoubleClick() {
                if (score < doubleClickCost) {
                    alert('Not enough coins!');
                    return;
                }

                score -= doubleClickCost;
                clickValue *= 2;
                doubleClickOwned++;
                doubleClickCost *= 2;

                document.getElementById('score').textContent = score;
                updateClickValueDisplay();
                updateShopInfo();
                saveGame();
            }

            function buyIdleCoins() {
                if (score < idleCost) {
                    alert('Not enough coins!');
                    return;
                }

                score -= idleCost;
                idleCoinsPerSecond += 5;
                idleOwned++;
                idleCost *= 2;

                document.getElementById('score').textContent = score;
                updateCpsDisplay();
                updateShopInfo();
                saveGame();
            }

            function buyKeySpam() {
                if (score < KEY_SPAM_COST) {
                    alert('Not enough coins!');
                    return;
                }

                score -= KEY_SPAM_COST;
                allowKeySpam = true;

                document.getElementById('score').textContent = score;
                updateSpamUnlockUI();
                saveGame();
            }

            loadGame();
            document.getElementById('score').textContent = score;
            updateClickValueDisplay();
            updateCpsDisplay();
            updateShopInfo();
            updateSpamUnlockUI();

            setInterval(() => {
                score += idleCoinsPerSecond;
                document.getElementById('score').textContent = score;
                saveGame();
            }, 1000);

            function toggleShop() {
                const panel = document.getElementById('shopPanel');
                panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            }

            function triggerClickAnimation() {
                const button = document.getElementById('clickButton');
                if (!button) return;

                button.classList.add('pressed');
                setTimeout(() => button.classList.remove('pressed'), 100);
            }

            function handleKeydown(event) {
                const isKeyTrigger = event.code === 'Space' || event.key === ' ' || event.code === 'ArrowUp' || event.key === 'ArrowUp';

                if (isKeyTrigger) {
                    if (!allowKeySpam && event.repeat) {
                        event.preventDefault();
                        return;
                    }

                    event.preventDefault();
                    triggerClickAnimation();
                    increaseScore();
                }
            }

            window.addEventListener('keydown', handleKeydown);
        </script>
    </body>
</html>
